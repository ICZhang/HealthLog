<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Log</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icon.jpeg" />
  <meta name="theme-color" content="#4A90E2" />
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  
</head>
<body>

  <!-- Auth Box -->
    <div class="card" id="auth-card">
        <h2 id="auth-title">Sign In</h2>
        <form id="auth-form">
        <input type="text" id="username" placeholder="Username" required />
        <input type="password" id="password" placeholder="Password" required />
        
        <div style="display: flex; align-items: center; margin: 4px 0 12px 0; font-size: 0.85rem; color: #666;">
            <input type="checkbox" id="show-password" style="width: auto; margin: 0 6px 0 0; cursor: pointer;" />
            <label for="show-password" style="margin: 0; cursor: pointer; user-select: none;">Show Password</label>
        </div>
    
        <button type="submit" id="auth-btn">Sign In</button>
        </form>
        <div id="error-msg" style="color: #e74c3c; margin-top: 8px; font-size: 0.85rem;"></div>
    
        <p class="toggle-text" id="toggle-wrapper" style="margin-top: 12px;">
        Don't have an account? <span class="toggle-link" id="toggle-auth" style="color: #4A90E2; cursor: pointer; text-decoration: underline;">Sign Up</span>
        </p>
    </div>

  <!-- Dashboard App UI -->
<div class="card hidden" id="dashboard">
    <h2>Evan's Daily Care Log</h2>
    <p style="font-size: 0.85rem; color: #666;">Logged in as: <strong id="user-email"></strong></p>
  
    <!-- Navigation Tabs -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button id="tab-new-btn" type="button" style="background-color: #4A90E2;">New Entry</button>
      <button id="tab-past-btn" type="button" style="background-color: #888;">Past Records</button>
    </div>
  
    <!-- SECTION 1: NEW ENTRY FORM -->
    <!-- SECTION 1: CARE LOG FORM -->
<!-- SECTION 1: CARE LOG FORM -->
<div id="section-new-entry">
    <form id="log-form">
      <!-- Hidden input to track document ID during edit mode -->
      <input type="hidden" id="editing-doc-id" value="" />
  
      <!-- Date & Time Header -->
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
        <label for="log-date"><strong>Date</strong></label>
        <input type="date" id="log-date" required style="width: 100%; margin-top: 4px;" />
        </div>
        <div>
        <label for="log-time"><strong>Log Time</strong></label>
        <input type="time" id="log-time" required style="width: 100%; margin-top: 4px;" />
        </div>
    </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Bowel Movements (Starts with 2 Rows) -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">BM (Bowel Movements)</h3>
        <button type="button" id="add-bm-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add BM</button>
      </div>
      <div id="bm-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial BM rows here -->
      </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Medications & Hydration (Starts with 2 Rows) -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">Cromolyn Doses & Other Meds</h3>
        <button type="button" id="add-med-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add Dose</button>
      </div>
      <div id="meds-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial Med rows here -->
      </div>
  
      <label for="herbal-meds-time" style="margin-top: 12px;">Herbal Meds Time</label>
      <input type="text" id="herbal-meds-time" placeholder="Time" />
  
      <label for="enteragram">Enteragram</label>
      <input type="text" id="enteragram" placeholder="Notes / Time" />
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />

        <!-- Formula & Hydration (Dynamic Rows) -->
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin:0;">Formula & Hydration</h3>
        <button type="button" id="add-formula-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add Row</button>
        </div>
        <div id="formula-container">
        <!-- JavaScript will auto-render dynamic rows here -->
        </div>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />

        <!-- Warm Water Tracking (Dedicated Section) -->
        <h3 style="margin-bottom: 10px;">Warm Water</h3>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
        <div>
            <label for="warm-water-cups"><strong>Cups Drunk</strong></label>
            <input type="number" id="warm-water-cups" min="0" step="0.5" placeholder="e.g. 2" style="width: 100%; margin-top: 4px;" />
        </div>
        <div>
            <label for="warm-water-time"><strong>Time</strong></label>
            <input type="time" id="warm-water-time" />
        </div>
        </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Activities (Starts with 2 Rows) -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">Activities List</h3>
        <button type="button" id="add-activity-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add Activity</button>
      </div>
      <div id="activities-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial Activity rows here -->
      </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Solid Foods & Enzymes -->
<h3>Solid Foods & Enzymes</h3>

<strong>Enzymes:</strong>
<div style="margin-top: 8px; margin-bottom: 15px;">
  
  <div class="enzyme-row">
    <input type="checkbox" id="enzyme-no-fenol" />
    <label for="enzyme-no-fenol">NO-FENOL</label>
    <input type="text" id="enzyme-no-fenol-notes" placeholder="Notes" />
  </div>

  <div class="enzyme-row">
    <input type="checkbox" id="enzyme-carb-dgts" />
    <label for="enzyme-carb-dgts">CARB DGTS</label>
    <input type="text" id="enzyme-carb-dgts-notes" placeholder="Notes" />
  </div>

  <div class="enzyme-row">
    <input type="checkbox" id="enzyme-chew" />
    <label for="enzyme-chew">CHEW</label>
    <input type="text" id="enzyme-chew-notes" placeholder="Notes" />
  </div>

</div>

    <strong>Foods & Amounts:</strong>
    <div style="margin-top: 8px;" id="foods-grid">
    
        <div class="food-row">
            <input type="checkbox" id="food-quinoa" name="food-check" value="Quinoa">
            <label for="food-quinoa">Quinoa</label>
            <input type="text" name="food-amount" placeholder="Amount (T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-potato" name="food-check" value="Potato">
            <label for="food-potato">Potato</label>
            <input type="text" name="food-amount" placeholder="Amount (T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-carrot" name="food-check" value="Carrot">
            <label for="food-carrot">Carrot</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-spinach" name="food-check" value="Spinach">
            <label for="food-spinach">Spinach</label>
            <input type="text" name="food-amount" placeholder="Amount (L)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-bokchoy" name="food-check" value="Bok Choy">
            <label for="food-bokchoy">Bok Choy</label>
            <input type="text" name="food-amount" placeholder="Amount (L)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-kobocha" name="food-check" value="Kobocha">
            <label for="food-kobocha">Kobocha</label>
            <input type="text" name="food-amount" placeholder="Amount (T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-snowpea" name="food-check" value="Snow Pea">
            <label for="food-snowpea">Snow Pea</label>
            <input type="text" name="food-amount" placeholder="Amount (P)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-cabbage" name="food-check" value="Cabbage">
            <label for="food-cabbage">Cabbage</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-pineapple" name="food-check" value="Pineapple">
            <label for="food-pineapple">Pineapple</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-chicken" name="food-check" value="Chicken">
            <label for="food-chicken">Chicken</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-codfish" name="food-check" value="Cod Fish">
            <label for="food-codfish">Cod Fish</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-beef" name="food-check" value="Beef">
            <label for="food-beef">Beef</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-bonebroth" name="food-check" value="Bone Broth">
            <label for="food-bonebroth">Bone Broth</label>
            <input type="text" name="food-amount" placeholder="Amount (C)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-veggiebroth" name="food-check" value="Veggie Broth">
            <label for="food-veggiebroth">Veggie Broth</label>
            <input type="text" name="food-amount" placeholder="Amount (C)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-salt" name="food-check" value="Salt">
            <label for="food-salt">Salt</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <input type="checkbox" id="food-oliveoil" name="food-check" value="Olive Oil">
            <label for="food-oliveoil">Olive Oil</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

    </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Day Instructions & Notes -->
      <h3>Day Instructions & Notes</h3>
      <textarea id="day-notes" rows="5" placeholder="Enter general notes, instructions, or observations for today..."></textarea>
  
      <button type="submit" id="save-log-btn">Save Care Log</button>
      <button type="button" id="cancel-edit-btn" class="hidden logout-btn" style="background-color: #888; margin-top: 8px;">Cancel Edit</button>
    </form>
  </div>
  
    <!-- SECTION 2: PAST RECORDS VIEW -->
    <div id="section-past-records" class="hidden">
      <h3>Past Care Records</h3>
      <ul class="log-list" id="log-list">
        <li style="color: #888; font-size: 0.9rem;">Loading entries...</li>
      </ul>
    </div>
  
    <button id="logout-btn" class="logout-btn">Sign Out</button>
  </div>
  
  <!-- Read-Only View Modal -->
    <div id="view-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000;">
    <div style="background: #fff; width: 90%; max-width: 500px; max-height: 80vh; overflow-y: auto; padding: 20px; border-radius: 8px; position: relative;">
      <button id="close-modal-btn" type="button" style="position: absolute; top: 10px; right: 10px; background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 4px 10px; cursor: pointer;">X</button>
      <div id="view-modal-body"></div>
    </div>
    </div>

</body>
</html>
