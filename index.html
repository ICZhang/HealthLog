<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Log</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icon.jpeg" />
  <meta name="theme-color" content="#4A90E2" />
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  
</head>
<body>

  <!-- Auth Box -->
  <div class="card" id="auth-container">
    <h2 id="auth-title">Sign In</h2>
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    
    <div style="display: flex; align-items: center; margin: 4px 0 12px 0; font-size: 0.85rem; color: #666;">
        <input type="checkbox" id="show-password" style="width: auto; margin: 0 6px 0 0; cursor: pointer;" />
        <label for="show-password" style="margin: 0; cursor: pointer; user-select: none;">Show Password</label>
    </div>

    <button id="auth-btn">Sign In</button>
    <div id="error-msg"></div>

    <p class="toggle-text" id="toggle-wrapper">
      Don't have an account? <span class="toggle-link" id="toggle-auth">Sign Up</span>
    </p>
  </div>

  <!-- Dashboard App UI -->
<div class="card hidden" id="dashboard">
    <h2>Evan's Daily Care Log</h2>
    <p style="font-size: 0.85rem; color: #666;">Logged in as: <strong id="user-email"></strong></p>
  
    <!-- Navigation Tabs -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px;">
      <button id="tab-new-btn" type="button" style="background-color: #4A90E2;">New Entry</button>
      <button id="tab-past-btn" type="button" style="background-color: #888;">Past Records</button>
    </div>
  
    <!-- SECTION 1: NEW ENTRY FORM -->
    <!-- SECTION 1: CARE LOG FORM -->
<!-- SECTION 1: CARE LOG FORM -->
<div id="section-new-entry">
    <form id="log-form">
      <!-- Hidden input to track document ID during edit mode -->
      <input type="hidden" id="editing-doc-id" value="" />
  
      <!-- Date Header -->
      <label for="log-date"><strong>Date</strong></label>
      <input type="date" id="log-date" required />
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Bowel Movements (Starts with 2 Rows) -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">BM (Bowel Movements)</h3>
        <button type="button" id="add-bm-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add BM</button>
      </div>
      <div id="bm-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial BM rows here -->
      </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Medications & Hydration (Starts with 2 Rows) -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">Cromolyn Doses & Other Meds</h3>
        <button type="button" id="add-med-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add Dose</button>
      </div>
      <div id="meds-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial Med rows here -->
      </div>
  
      <label for="herbal-meds-time" style="margin-top: 12px;">Herbal Meds Time</label>
      <input type="text" id="herbal-meds-time" placeholder="Time" />
  
      <label for="enteragram">Enteragram</label>
      <input type="text" id="enteragram" placeholder="Notes / Time" />
  
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 15px;">
        <h3 style="margin:0;">Formula & Hydration</h3>
        <button type="button" id="add-formula-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add Row</button>
      </div>
      <div id="formula-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial Formula rows here -->
      </div>
  
      <label for="warm-water-cups" style="margin-top: 12px;">Warm Water (Cups)</label>
      <input type="number" id="warm-water-cups" min="0" step="0.5" placeholder="0" />
      
      <label for="warm-water-time">Warm Water Time</label>
      <input type="text" id="warm-water-time" placeholder="Time" />
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Activities (Starts with 2 Rows) -->
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin:0;">Activities List</h3>
        <button type="button" id="add-activity-btn" style="width: auto; padding: 6px 12px; font-size: 0.85rem; margin:0;">+ Add Activity</button>
      </div>
      <div id="activities-container" style="margin-top: 10px;">
        <!-- JavaScript will auto-render 2 initial Activity rows here -->
      </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Solid Foods & Enzymes -->
<h3>Solid Foods & Enzymes</h3>

<strong>Enzymes:</strong>
<div style="margin-top: 8px; margin-bottom: 15px;">
  
  <div class="enzyme-row">
    <label><input type="checkbox" id="enzyme-no-fenol" /> NO-FENOL</label>
    <input type="text" id="enzyme-no-fenol-notes" placeholder="Notes / Dose" />
  </div>

  <div class="enzyme-row">
    <label><input type="checkbox" id="enzyme-carb-dgts" /> CARB DGTS</label>
    <input type="text" id="enzyme-carb-dgts-notes" placeholder="Notes / Dose" />
  </div>

  <div class="enzyme-row">
    <label><input type="checkbox" id="enzyme-chew" /> CHEW</label>
    <input type="text" id="enzyme-chew-notes" placeholder="Notes / Dose" />
  </div>

</div>

    <strong>Foods & Amounts:</strong>
    <div style="display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px;" id="foods-grid">
    
        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Quinoa"> Quinoa</label>
            <input type="text" name="food-amount" placeholder="Amount (T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Potato"> Potato</label>
            <input type="text" name="food-amount" placeholder="Amount (T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Carrot"> Carrot</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Spinach"> Spinach</label>
            <input type="text" name="food-amount" placeholder="Amount (L)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Bok Choy"> Bok Choy</label>
            <input type="text" name="food-amount" placeholder="Amount (L)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Kobocha"> Kobocha</label>
            <input type="text" name="food-amount" placeholder="Amount (T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Snow Pea"> Snow Pea</label>
            <input type="text" name="food-amount" placeholder="Amount (P)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Cabbage"> Cabbage</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Pineapple"> Pineapple</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Chicken"> Chicken</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Cod Fish"> Cod Fish</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Beef"> Beef</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Bone Broth"> Bone Broth</label>
            <input type="text" name="food-amount" placeholder="Amount (C)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Veggie Broth"> Veggie Broth</label>
            <input type="text" name="food-amount" placeholder="Amount (C)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Salt"> Salt</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

        <div class="food-row">
            <label><input type="checkbox" name="food-check" value="Olive Oil"> Olive Oil</label>
            <input type="text" name="food-amount" placeholder="Amount (t/T)" />
        </div>

    </div>
  
      <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ddd;" />
  
      <!-- Day Instructions & Notes -->
      <h3>Day Instructions & Notes</h3>
      <textarea id="day-notes" rows="5" placeholder="Enter general notes, instructions, or observations for today..."></textarea>
  
      <button type="submit" id="save-log-btn">Save Care Log</button>
      <button type="button" id="cancel-edit-btn" class="hidden logout-btn" style="background-color: #888; margin-top: 8px;">Cancel Edit</button>
    </form>
  </div>
  
    <!-- SECTION 2: PAST RECORDS VIEW -->
    <div id="section-past-records" class="hidden">
      <h3>Past Care Records</h3>
      <ul class="log-list" id="log-list">
        <li style="color: #888; font-size: 0.9rem;">Loading entries...</li>
      </ul>
    </div>
  
    <button id="logout-btn" class="logout-btn">Sign Out</button>
  </div>

</body>
</html>
