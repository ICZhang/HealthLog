<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Health Log</title>
  
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="/icon.jpeg" />
  <meta name="theme-color" content="#4A90E2" />
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
  
</head>
<body>

  <!-- Auth Box -->
  <div class="card" id="auth-container">
    <h2 id="auth-title">Sign In</h2>
    <input type="text" id="username" placeholder="Username" required />
    <input type="password" id="password" placeholder="Password" required />
    
    <div style="display: flex; align-items: center; margin: 4px 0 12px 0; font-size: 0.85rem; color: #666;">
        <input type="checkbox" id="show-password" style="width: auto; margin: 0 6px 0 0; cursor: pointer;" />
        <label for="show-password" style="margin: 0; cursor: pointer; user-select: none;">Show Password</label>
    </div>

    <button id="auth-btn">Sign In</button>
    <div id="error-msg"></div>

    <p class="toggle-text" id="toggle-wrapper">
      Don't have an account? <span class="toggle-link" id="toggle-auth">Sign Up</span>
    </p>
  </div>

  <!-- Dashboard App UI -->
  <div class="card hidden" id="dashboard">
    <h2>Health Log</h2>
    <p style="font-size: 0.85rem; color: #666;">User: <strong id="user-email"></strong></p>

    <hr style="border: none; border-top: 1px solid #eee; margin: 15px 0;" />

    <!-- Log Entry Form -->
    <h3>New Entry</h3>
    <form id="log-form">
      <label for="symptom">Symptom / Metric</label>
      <input type="text" id="symptom" placeholder="e.g., Headache, Blood Pressure" required />

      <label for="severity">Severity / Rating (1-10)</label>
      <select id="severity">
        <option value="1">1 - Very Mild</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5 - Moderate</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10 - Severe</option>
      </select>

      <label for="notes">Notes</label>
      <textarea id="notes" rows="2" placeholder="Additional details or triggers..."></textarea>

      <button type="submit" id="save-log-btn">Save Log Entry</button>
    </form>

    <!-- Past Logs Container -->
    <h3 style="margin-top: 25px;">Past Entries</h3>
    <ul class="log-list" id="log-list">
      <li style="color: #888; font-size: 0.9rem;">Loading entries...</li>
    </ul>

    <button id="logout-btn" class="logout-btn">Sign Out</button>
  </div>
  
</body>
</html>
